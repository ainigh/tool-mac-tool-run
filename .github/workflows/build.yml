name: Build

# Every push: test, and build the app. A push to main also publishes it as a GitHub release,
# which is what install.sh downloads.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same branch replaces a run still going.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The logic and the Flow language, on Linux (cheap and quick).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"
      - run: swift test

  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Test
        run: swift test
      - name: Build the app
        run: |
          echo "VERSION=0.1.${{ github.run_number }}" >> "$GITHUB_ENV"
          VERSION="0.1.${{ github.run_number }}" BRANCH="${{ github.ref_name }}" scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ToolMacToolRun
          path: build/ToolMacToolRun.zip
      - name: Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        # A re-run keeps its run number, so the release may already be there: replace its zip.
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" build/ToolMacToolRun.zip --clobber
          else
            gh release create "v$VERSION" build/ToolMacToolRun.zip --target "$GITHUB_SHA" \
              --title "Tool Mac Tool Run $VERSION" --notes "$(git log -1 --format=%B)"
          fi
